# ── DataSource ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/safety_bmw_test
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ──────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── CORS ────────────────────────────────────────────────────────
# Orígenes del frontend permitidos a consumir la API (separados por coma, sin slash final).
# Dev: Vite/CRA local. Prod: agregar aquí (o sobreescribir con la variable de entorno
# APP_CORS_ALLOWED_ORIGINS) el dominio real donde quede desplegado el frontend.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Archivos subidos (logos de tienda) ────────────────────────────
# Dev: carpeta dentro del proyecto backend. Prod: cambiar a la ruta del server
# (el resto del código no cambia, solo esta propiedad).
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ── JWT ─────────────────────────────────────────────────────────
# El valor real (rotado tras la exposición del secreto anterior en el repo público) vive
# SOLO en la variable de entorno APP_JWT_SECRET de Coolify, nunca en este archivo. El
# default de aquí es exclusivamente para desarrollo local (inofensivo: nadie más que tu
# propia máquina valida tokens contra él).
app.jwt.secret=${APP_JWT_SECRET:solo-para-desarrollo-local-nunca-usar-en-produccion}
app.jwt.expiration=86400000

# ── Jackson ─────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Correo (envío de tickets en PDF) ─────────────────────────────
# Gmail con contraseña de aplicación: https://myaccount.google.com/apppasswords
# (requiere verificación en 2 pasos activada en la cuenta de Google). El valor real vive
# SOLO en la variable de entorno APP_MAIL_PASSWORD de Coolify — sin ella, el envío de
# correo simplemente falla en local (no bloquea el resto de la app).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gutierrez.alexisluna@gmail.com
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

