# ── DataSource ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/safety_bmw_test
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ──────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── CORS ────────────────────────────────────────────────────────
# Orígenes del frontend permitidos a consumir la API (separados por coma, sin slash final).
# Dev: Vite/CRA local. Prod: agregar aquí (o sobreescribir con la variable de entorno
# APP_CORS_ALLOWED_ORIGINS) el dominio real donde quede desplegado el frontend.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Frontend ────────────────────────────────────────────────────
# Base del frontend (sin slash final), usada para armar el link de recuperación de
# contraseña que se manda por correo (ver AuthService#forgotPassword). Dev: Vite local.
# Prod: sobreescribir con la variable de entorno APP_FRONTEND_URL apuntando al dominio
# real donde quede desplegado el frontend (el mismo que va en app.cors.allowed-origins).
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ── Archivos subidos (logo de tienda, fotos de producto) ──────────
# Dev: carpeta dentro del proyecto backend. Prod: cambiar a la ruta del server
# (el resto del código no cambia, solo esta propiedad).
app.uploads.dir=uploads
# 6MB, NO 5MB a propósito: es un techo de seguridad por encima del límite real que valida
# cada servicio (TiendaLogoService=3MB, ProductImageService=5MB, ver esas clases). Si este
# valor global fuera igual a 5MB, un archivo de exactamente 5MB+1 byte lo rechazaría ESTE
# filtro genérico de Spring (con un error crudo, sin el mensaje amigable) antes de que el
# servicio llegara a validarlo con su propio mensaje ("no debe pesar más de 5 MB"). Con el
# margen, el mensaje amigable es el que de verdad se alcanza a mostrar en el caso normal;
# este límite global solo debería dispararse ante un archivo absurdamente pesado.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ── JWT ─────────────────────────────────────────────────────────
# El valor real (rotado tras la exposición del secreto anterior en el repo público) vive
# SOLO en la variable de entorno APP_JWT_SECRET de Coolify, nunca en este archivo. El
# default de aquí es exclusivamente para desarrollo local (inofensivo: nadie más que tu
# propia máquina valida tokens contra él).
app.jwt.secret=${APP_JWT_SECRET:solo-para-desarrollo-local-nunca-usar-en-produccion}
# Access token JWT: vida corta a propósito (30 min) — la renovación transparente la da el
# refresh token de abajo (ver AuthService#refreshAccessToken), no extender este valor.
app.jwt.expiration=1800000
# Refresh token opaco (RefreshToken, no JWT): 8h, pensado para cubrir un turno de trabajo
# completo sin pedir login de nuevo. Viaja como cookie httpOnly (ver AuthController).
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:28800000}

# ── Cookie del refresh token ──────────────────────────────────────
# Dev (por defecto): frontend y backend son "mismo origen" desde la perspectiva del
# navegador gracias al proxy de Vite (ver vite.config.js), así que alcanza con
# secure=false (no hay HTTPS en local) y sameSite=Lax.
# Prod: frontend (sitio estático) y backend quedan en dominios distintos → la cookie es
# cross-site, así que Coolify DEBE sobreescribir con APP_COOKIE_SECURE=true y
# APP_COOKIE_SAMESITE=None (los navegadores exigen Secure=true junto con SameSite=None).
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.samesite=${APP_COOKIE_SAMESITE:Lax}

# ── Jackson ─────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
# El sistema usa LocalDateTime (sin zona) en todos lados, así que esto no le aplica a esos
# campos — se deja por si algún día aparece un Instant/Date/ZonedDateTime (ej. alguna
# librería externa), para que también se muestre en hora de México y no en UTC. El fix real
# para LocalDateTime.now() es la zona horaria del JVM, ver BoutiquePosApplication.
spring.jackson.time-zone=America/Mexico_City

# ── QZ Tray (firma de conexión para imprimir tickets) ─────────────
# Certificado público + llave privada que el backend usa para firmar cada conexión que el
# frontend hace a QZ Tray (ver utils/printer.js y QzSigningService). Sin firma, QZ Tray
# trata la conexión como "anónima": no puede recordar la autorización del cajero y la pide
# en cada venta. Con firma, aunque el certificado sea autofirmado (no hace falta comprarlo),
# QZ Tray sí puede recordar la decisión de forma permanente.
# Los archivos NO se versionan (carpeta qz-keys/ en .gitignore, junto a uploads/) — se
# generan una sola vez por entorno y se leen de disco en local (rutas de abajo).
# En producción (Coolify) no hay disco persistente para montar archivos, así que ahí se usa
# el par en base64 vía variable de entorno (ver QzSigningService.load): generarlo una vez con
# `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private-key.pem` +
# `openssl req -new -x509 -key private-key.pem -out digital-certificate.pem -days 3650 -subj "/CN=..."`,
# luego `base64 -w0 archivo.pem` y pegar el resultado en las variables de Coolify.
app.qz.certificate-path=${APP_QZ_CERT_PATH:qz-keys/digital-certificate.pem}
app.qz.private-key-path=${APP_QZ_KEY_PATH:qz-keys/private-key.pem}
app.qz.certificate-base64=${APP_QZ_CERTIFICATE_BASE64:}
app.qz.private-key-base64=${APP_QZ_PRIVATE_KEY_BASE64:}

