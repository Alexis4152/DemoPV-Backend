# ── DataSource ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/safety_bmw_test
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ──────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── CORS ────────────────────────────────────────────────────────
# Orígenes del frontend permitidos a consumir la API (separados por coma, sin slash final).
# Dev: Vite/CRA local. Prod: agregar aquí (o sobreescribir con la variable de entorno
# APP_CORS_ALLOWED_ORIGINS) el dominio real donde quede desplegado el frontend.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Frontend ────────────────────────────────────────────────────
# Base del frontend (sin slash final), usada para armar el link de recuperación de
# contraseña que se manda por correo (ver AuthService#forgotPassword). Dev: Vite local.
# Prod: sobreescribir con la variable de entorno APP_FRONTEND_URL apuntando al dominio
# real donde quede desplegado el frontend (el mismo que va en app.cors.allowed-origins).
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ── Archivos subidos (logos de tienda) ────────────────────────────
# Dev: carpeta dentro del proyecto backend. Prod: cambiar a la ruta del server
# (el resto del código no cambia, solo esta propiedad).
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ── JWT ─────────────────────────────────────────────────────────
# El valor real (rotado tras la exposición del secreto anterior en el repo público) vive
# SOLO en la variable de entorno APP_JWT_SECRET de Coolify, nunca en este archivo. El
# default de aquí es exclusivamente para desarrollo local (inofensivo: nadie más que tu
# propia máquina valida tokens contra él).
app.jwt.secret=${APP_JWT_SECRET:solo-para-desarrollo-local-nunca-usar-en-produccion}
app.jwt.expiration=86400000

# ── Jackson ─────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── QZ Tray (firma de conexión para imprimir tickets) ─────────────
# Certificado público + llave privada que el backend usa para firmar cada conexión que el
# frontend hace a QZ Tray (ver utils/printer.js y QzSigningService). Sin firma, QZ Tray
# trata la conexión como "anónima": no puede recordar la autorización del cajero y la pide
# en cada venta. Con firma, aunque el certificado sea autofirmado (no hace falta comprarlo),
# QZ Tray sí puede recordar la decisión de forma permanente.
# Los archivos NO se versionan (carpeta qz-keys/ en .gitignore, junto a uploads/) — se
# generan una sola vez por entorno y se leen de disco en local (rutas de abajo).
# En producción (Coolify) no hay disco persistente para montar archivos, así que ahí se usa
# el par en base64 vía variable de entorno (ver QzSigningService.load): generarlo una vez con
# `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private-key.pem` +
# `openssl req -new -x509 -key private-key.pem -out digital-certificate.pem -days 3650 -subj "/CN=..."`,
# luego `base64 -w0 archivo.pem` y pegar el resultado en las variables de Coolify.
app.qz.certificate-path=${APP_QZ_CERT_PATH:qz-keys/digital-certificate.pem}
app.qz.private-key-path=${APP_QZ_KEY_PATH:qz-keys/private-key.pem}
app.qz.certificate-base64=${APP_QZ_CERTIFICATE_BASE64:}
app.qz.private-key-base64=${APP_QZ_PRIVATE_KEY_BASE64:}

